    <ellipse cx="0" cy="0" rx="54" ry="20"/><circle cx="58" cy="-4" r="16"/><rect x="-60" y="-18" width="26" height="36" rx="8"/>
    <path d="M-74 -20 l-26 -12 -4 12 22 16z"/><path d="M-74 20 l-26 12 -4 -12 22 -16z"/>
