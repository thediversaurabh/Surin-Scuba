  <g fill="#0e5a6e" opacity="0.5"><circle cx="360" cy="360" r="150"/></g>
  <g fill="#eaf2f1" opacity="0.55">
    <g transform="translate(300 320)"><path d="M0 0 q16 -8 32 0 q-16 8 -32 0z"/><path d="M0 0 l-10 -6 0 12z"/></g>
    <g transform="translate(380 300) scale(0.8)"><path d="M0 0 q16 -8 32 0 q-16 8 -32 0z"/><path d="M0 0 l-10 -6 0 12z"/></g>
    <g transform="translate(420 380) scale(0.9)"><path d="M0 0 q16 -8 32 0 q-16 8 -32 0z"/><path d="M0 0 l-10 -6 0 12z"/></g>
    <g transform="translate(320 420) scale(0.7)"><path d="M0 0 q16 -8 32 0 q-16 8 -32 0z"/><path d="M0 0 l-10 -6 0 12z"/></g>
    <g transform="translate(350 360)"><path d="M0 0 q16 -8 32 0 q-16 8 -32 0z"/><path d="M0 0 l-10 -6 0 12z"/></g>
  </g>
