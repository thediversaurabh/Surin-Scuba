<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Divers exploring an offshore pinnacle surrounded by fish">
  <defs>
    <linearGradient id="wp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ba0b8"/><stop offset="0.55" stop-color="#0e5a6e"/><stop offset="1" stop-color="#041a22"/></linearGradient>
    <linearGradient id="rp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cff2f9" stop-opacity="0.45"/><stop offset="1" stop-color="#cff2f9" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#wp)"/>
  <g opacity="0.4"><polygon points="300,-20 400,-20 260,700 180,700" fill="url(#rp)"/><polygon points="720,-20 800,-20 760,660 680,660" fill="url(#rp)"/></g>
