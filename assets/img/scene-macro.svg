  </defs>
  <rect width="1000" height="1000" fill="url(#wmac)"/>
  <!-- soft coral background -->
  <g stroke="#0a4658" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M200 1000 q-40 -400 60 -560 M400 1000 q0 -420 80 -600 M700 1000 q60 -360 -20 -560"/>
  </g>
