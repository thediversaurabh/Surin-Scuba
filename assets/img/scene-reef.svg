  <g transform="translate(540 640)" opacity="0.8"><g stroke="#5fc9dc" stroke-width="4" stroke-linecap="round">
    <path d="M0 0 v-40 M0 0 l-20 -34 M0 0 l20 -34 M0 0 l-36 -20 M0 0 l36 -20 M0 0 l-14 -40 M0 0 l14 -40"/></g></g>
  <g fill="#eaf2f1" opacity="0.12"><circle cx="200" cy="200" r="2.5"/><circle cx="500" cy="150" r="2"/><circle cx="900" cy="220" r="2.5"/><circle cx="1050" cy="140" r="2"/><circle cx="350" cy="300" r="2"/><circle cx="700" cy="120" r="2"/></g>
