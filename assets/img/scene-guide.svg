<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A dive guide giving the OK signal underwater">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ba0b8"/><stop offset="0.55" stop-color="#0e5a6e"/><stop offset="1" stop-color="#041a22"/></linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cff2f9" stop-opacity="0.4"/><stop offset="1" stop-color="#cff2f9" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#wg)"/>
  <g opacity="0.4"><polygon points="160,-20 280,-20 120,780 40,780" fill="url(#rg)"/><polygon points="620,-20 720,-20 700,760 600,760" fill="url(#rg)"/></g>
  <!-- diver upright, signalling -->
  <g transform="translate(500 560)" fill="#04191f">
    <circle cx="0" cy="-150" r="70"/>
    <rect x="-70" y="-90" width="140" height="220" rx="46"/>
    <!-- tank -->
    <rect x="-24" y="-96" width="48" height="150" rx="22" fill="#062a35"/>
    <!-- arm making OK -->
    <path d="M60 -40 q90 -30 120 -110" stroke="#04191f" stroke-width="46" fill="none" stroke-linecap="round"/>
    <circle cx="188" cy="-158" r="34"/><circle cx="188" cy="-158" r="16" fill="#0e5a6e"/>
    <!-- other arm -->
    <path d="M-60 -30 q-70 30 -80 110" stroke="#04191f" stroke-width="42" fill="none" stroke-linecap="round"/>
    <!-- legs / fins -->
    <path d="M-34 120 q-20 120 -70 190 l60 26 q40 -90 44 -190z"/>
    <path d="M34 120 q20 120 70 190 l-60 26 q-40 -90 -44 -190z"/>
    <!-- mask -->
    <rect x="-46" y="-176" width="92" height="44" rx="16" fill="#0e5a6e" opacity="0.8"/>
  </g>
  <!-- bubbles -->
  <g fill="#dff7fc" opacity="0.5"><circle cx="560" cy="360" r="8"/><circle cx="590" cy="300" r="5"/><circle cx="560" cy="250" r="9"/><circle cx="610" cy="200" r="4"/><circle cx="580" cy="150" r="6"/></g>
  <g fill="#eaf2f1" opacity="0.12"><circle cx="180" cy="300" r="2.5"/><circle cx="780" cy="240" r="2"/><circle cx="250" cy="600" r="2"/><circle cx="820" cy="560" r="2.5"/><circle cx="150" cy="820" r="2"/></g>
</svg>
